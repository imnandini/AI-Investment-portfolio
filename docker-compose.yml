services:
  backend:
    build: ./backend
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-local-dev-only-change-me}@db:5432/${POSTGRES_DB:-investment_copilot}
      SECRET_KEY: ${SECRET_KEY:-local-development-key-change-before-production}
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080"]'
      FINANCIAL_DATA_PROVIDER: none
      DAILY_PRICE_PROVIDER: ${DAILY_PRICE_PROVIDER:-none}
      EMBEDDING_PROVIDER: hash
      INTERNAL_API_URL: http://127.0.0.1:8000
      LANGSMITH_TRACING: 'false'
      INDMONEY_TOKEN_KEY: ${INDMONEY_TOKEN_KEY:-}
      INDMONEY_REDIRECT_URI: ${INDMONEY_REDIRECT_URI:-http://127.0.0.1:8080/portfolios}
      INDMONEY_CLIENT_ID: ${INDMONEY_CLIENT_ID:-}
      INDMONEY_CLIENT_SECRET: ${INDMONEY_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
  db:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-investment_copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
